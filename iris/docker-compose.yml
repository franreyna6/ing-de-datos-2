# Hito 9 - Entidades complejas del Fixture 2030 - InterSystems IRIS Community
#
# Imagen oficial indicada por el enunciado (RNF1, seccion 5.1).
# Persistencia (Durable %SYS): ISC_DATA_DIRECTORY=/durable hace que la
# instancia guarde su configuracion y sus bases en ~/docker/data/iris, por lo
# que los datos sobreviven a "docker compose down" y a recrear el contenedor.
# En Windows, levantarlo desde WSL: si ~/docker/data/iris esta en el disco de
# Windows (NTFS), IRIS no puede hacer chown sobre /durable y no arranca
# (README, nota de Windows).
# Los puertos solo escuchan en 127.0.0.1 (acceso local).
#
# Montajes de solo lectura:
#   ./src         -> /iris/src   clases .cls que se cargan y compilan
#   ./data/origen -> /iris/data  CSV del Hito 5 para la carga inicial
services:
  iris:
    image: intersystems/iris-community:latest-cd
    container_name: fixture2030-iris
    restart: unless-stopped
    ports:
      - "127.0.0.1:1972:1972"     # superserver (ODBC/JDBC)
      - "127.0.0.1:52773:52773"   # Management Portal
    environment:
      - ISC_DATA_DIRECTORY=/durable
    volumes:
      - ${HOME}/docker/data/iris:/durable
      - ./src:/iris/src:ro
      - ./data/origen:/iris/data:ro
