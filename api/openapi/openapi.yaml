openapi: 3.1.0
info:
  title: Fixture 2030 API integrada
  description: API REST que expone casos de uso del Fixture Mundial 2030 sobre seis
    fuentes NoSQL (MongoDB, Neo4j, Cassandra, Redis, InfluxDB e IRIS) mediante adaptadores
    separados. Hito 10 - Grupo 8.
  version: 1.0.0
paths:
  /equipos/{codigo}:
    get:
      tags:
      - equipos
      summary: Recupera un equipo desde el modulo documental (MongoDB)
      operationId: get_equipo_equipos__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - ARG
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /equipos/{codigo}/jugadores:
    get:
      tags:
      - equipos
      summary: Lista paginada de jugadores de un equipo (MongoDB)
      operationId: get_jugadores_equipos__codigo__jugadores_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - ARG
          title: Codigo
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Delantero
          title: Posicion
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaJugadores'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /partidos/{codigo}/eventos:
    get:
      tags:
      - partidos
      summary: Eventos conectados a un partido (Neo4j)
      operationId: get_eventos_partidos__codigo__eventos_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - F2030-001
          title: Codigo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosDePartido'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /partidos/{codigo}/comentarios:
    get:
      tags:
      - partidos
      summary: Comentarios de un partido en una ventana de 5 min (Cassandra)
      operationId: get_comentarios_partidos__codigo__comentarios_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - F2030-063
          title: Codigo
      - name: instante
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Instante ISO-8601 dentro de la ventana a leer. Si se omite,
            se usa la hora actual.
          examples:
          - '2030-06-22T20:23:00Z'
          title: Instante
        description: Instante ISO-8601 dentro de la ventana a leer. Si se omite, se
          usa la hora actual.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaComentarios'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - partidos
      summary: Publica un comentario en un partido (Cassandra)
      operationId: post_comentario_partidos__codigo__comentarios_post
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - F2030-063
          title: Codigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoComentario'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComentarioCreado'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /partidos/{codigo}/estadisticas:
    get:
      tags:
      - partidos
      summary: Estadisticas temporales de un partido en un intervalo (InfluxDB)
      operationId: get_estadisticas_partidos__codigo__estadisticas_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - F2030-018
          title: Codigo
      - name: desde
        in: query
        required: true
        schema:
          type: string
          examples:
          - '2030-06-13T09:00:00Z'
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          examples:
          - '2030-06-13T09:15:00Z'
          title: Hasta
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estadisticas'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /partidos/{codigo}/detalle:
    get:
      tags:
      - partidos
      summary: Detalle del partido como entidad compleja (IRIS)
      operationId: get_detalle_partidos__codigo__detalle_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - F2030-001
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetallePartido'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sesiones/{sesion_id}:
    get:
      tags:
      - sesiones
      summary: Estado de una sesion de usuario (Redis)
      operationId: get_sesion_sesiones__sesion_id__get
      parameters:
      - name: sesion_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - s-demo-001
          title: Sesion Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sesiones:
    post:
      tags:
      - sesiones
      summary: Crea una sesion (Redis Hash con TTL de 30 min de inactividad)
      operationId: post_sesion_sesiones_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSesion'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sesiones/{sesion_id}/actividad:
    post:
      tags:
      - sesiones
      summary: Registra actividad y renueva el TTL (TTL deslizante, Redis)
      operationId: post_actividad_sesiones__sesion_id__actividad_post
      parameters:
      - name: sesion_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - s-1a2b3c4d5e6f
          title: Sesion Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActiva'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos:
    post:
      tags:
      - demo en vivo (Hito 13)
      summary: Crea un partido de laboratorio (IRIS decide; Neo4j y Redis reciben)
      description: IRIS crea el objeto Partido en estado Programado y designa una
        terna arbitral NEUTRAL (regla del Hito 9). Despues se crea el partido en el
        grafo (DISPUTA, SE_JUEGA_EN) y la copia de estado en Redis.
      operationId: post_partido_vivo_partidos_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPartidoVivo'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionVivo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/iniciar:
    post:
      tags:
      - demo en vivo (Hito 13)
      summary: Programado -> EnJuego (IRIS valida la transicion)
      operationId: post_iniciar_vivo_partidos__codigo__iniciar_post
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionVivo'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/eventos:
    post:
      tags:
      - demo en vivo (Hito 13)
      summary: Registra un gol o una tarjeta (IRIS valida; Neo4j lo conecta)
      description: 'IRIS aplica las reglas del partido: solo EnJuego, minuto 1-120
        y jugador de uno de los dos equipos. Si las viola: **409** con el motivo que
        dio IRIS. Si se acepta, el evento se agrega a Neo4j como nodo (evento -> jugador
        -> equipo) y el marcador se copia a Redis.'
      operationId: post_evento_vivo_partidos__codigo__eventos_post
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoEventoVivo'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoVivoRegistrado'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/finalizar:
    post:
      tags:
      - demo en vivo (Hito 13)
      summary: EnJuego -> Finalizado (IRIS valida la transicion)
      operationId: post_finalizar_vivo_partidos__codigo__finalizar_post
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionVivo'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/reloj:
    put:
      tags:
      - demo en vivo (Hito 13)
      summary: 'Actualiza el minuto de juego (dato efimero: solo Redis)'
      operationId: put_reloj_vivo_partidos__codigo__reloj_put
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojVivo'
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/estadisticas:
    post:
      tags:
      - demo en vivo (Hito 13)
      summary: Escribe estadisticas por segundo (InfluxDB, line protocol)
      description: 'Mismo esquema del Hito 8: tags partido_id, equipo_id, sede, grupo;
        fields posesion_pct, pases_acum, tiros_acum, recuperaciones_acum. Lote maximo:
        500 puntos.'
      operationId: post_estadisticas_vivo_partidos__codigo__estadisticas_post
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoteEstadisticasVivo'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasEscritas'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vivo/partidos/{codigo}/tablero:
    get:
      tags:
      - demo en vivo (Hito 13)
      summary: Una pantalla, seis bases (consultadas en paralelo)
      description: 'Devuelve una seccion por base con su propio estado (ok, http,
        ms). Si una base esta caida, SOLO su seccion trae error: el aislamiento de
        fallas del Hito 10, visible en una sola respuesta.'
      operationId: get_tablero_vivo_partidos__codigo__tablero_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          examples:
          - H13-DEMO-URUARG
          title: Codigo
      - name: local
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - URU
          title: Local
      - name: visitante
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - ARG
          title: Visitante
      - name: minutos
        in: query
        required: false
        schema:
          type: integer
          maximum: 180
          minimum: 1
          description: Ventana de estadisticas a agregar
          default: 10
          title: Minutos
        description: Ventana de estadisticas a agregar
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableroVivo'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /salud:
    get:
      tags:
      - sistema
      summary: Estado de la API y disponibilidad de cada fuente
      operationId: salud_salud_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
components:
  schemas:
    Comentario:
      properties:
        comentarioId:
          type: string
          title: Comentarioid
        creadoEn:
          anyOf:
          - type: string
          - type: 'null'
          title: Creadoen
        usuarioId:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuarioid
        contenido:
          anyOf:
          - type: string
          - type: 'null'
          title: Contenido
        estado:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
        likes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Likes
      type: object
      required:
      - comentarioId
      title: Comentario
    ComentarioCreado:
      properties:
        partido:
          type: string
          title: Partido
        ventana:
          type: string
          title: Ventana
        comentarioId:
          type: string
          title: Comentarioid
        creadoEn:
          type: string
          title: Creadoen
      type: object
      required:
      - partido
      - ventana
      - comentarioId
      - creadoEn
      title: ComentarioCreado
    DetallePartido:
      properties:
        codigo:
          type: string
          title: Codigo
        fecha:
          anyOf:
          - type: string
          - type: 'null'
          title: Fecha
        fase:
          anyOf:
          - type: string
          - type: 'null'
          title: Fase
        estado:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
          examples:
          - Finalizado
        golesLocal:
          anyOf:
          - type: integer
          - type: 'null'
